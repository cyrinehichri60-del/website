<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <body style="background-color: rgb(233, 162, 82);"></body>


    <!-- Contact -->
    <section class="container mt-5">
        <h2 class="text-center mb-4">📩Contactez-moi</h2>
        <main class="main">

            <!-- Page Title -->
            <div class="page-title light-background">
                <div class="container text-center">
                    <nav class="breadcrumbs">
                        <a href="index.html" class="text-dark text-decoration-none"><strong>Home</strong>/</a>
                        <span class="current">Contact</span>
                    </nav>
                </div>
            </div><!-- End Page Title -->
        </main>

        <form>
            <div class="mb-3">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control">
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4"></textarea>
            </div>

            <button type="submit" class="btn" style="background-color: rgb(228, 138, 3); color: white;">
                <strong>Envoyer</strong>
            </button>
        </form>
    </section>

</body>

</html>
