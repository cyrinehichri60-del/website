    <script>
        function filterSelection(category) {
            let items = document.querySelectorAll('.filter');

            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
