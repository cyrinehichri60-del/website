        <script>
            function showBrand(category) {
                let items = document.querySelectorAll('.filter-item');

                items.forEach(item => {
                    if (category === "all" || item.classList.contains(category)) {
                        item.style.display = "block";
                    } else {
                        item.style.display = "none";
                    }
                });
            }
